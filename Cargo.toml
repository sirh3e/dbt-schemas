[package]
name = "dbt-schemas"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT AND Apache-2.0"
repository = "https://github.com/sirh3e/dbt-schemas"
description = "Rust types for dbt's YAML files and JSON artifacts, generated from dbt-labs' JSON Schemas, and marked-YAML helpers"
keywords = ["dbt", "json-schema", "yaml", "manifest"]
categories = ["parser-implementations", "development-tools"]
include = ["src/**", "build.rs", "build/**", "schemas/**/*.json", "README.md", "CHANGELOG.md", "LICENSE", "LICENSE-APACHE", "NOTICE"]

[dependencies]
regress = "0.12"
saphyr = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
schemars = "0.8.22"
# preserve_order: the preprocessing keeps the pristine files' key order,
# which rule (g)'s "first definition wins" depends on. Build dependencies
# resolve their features apart, so the library's serde_json is unchanged.
serde_json = { version = "1", features = ["preserve_order"] }
typify = "0.8"

[dev-dependencies]
pretty_assertions = "1"
# the preprocessing rules run in tests as they do in build.rs
serde_json = { version = "1", features = ["preserve_order"] }
rstest = "0.28"
