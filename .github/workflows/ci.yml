name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: just,git-cliff
      # build.rs preprocesses the schemas and fails the build if a field the
      # projection or RELAX_TO_ANY names is gone upstream
      - run: just check
      - name: the history parses as Conventional Commits
        run: git cliff --unreleased > /dev/null
